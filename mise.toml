[tools]
bun = "1.3.0"
pass-cli = "latest"
node = "24.9.0"
"npm:varlock" = "1.13.0"
usage = "3.5.6"

[plugins]
pass-cli = "https://github.com/DCC-BS/mise-proton-pass-cli"

[hooks]
postinstall = { task = "install" }
enter = { task = "enter-checks" }

[tasks.install]
description = "install npm packages"
run = [
    "bun install",
    "bunx nuxi prepare",
]

[tasks."cleanup:layers"]
description = "cleanup layer files"
run = [
    "rm -rf ./node_modules/.*c12",
    "rm -rf ./node_modules/c12",
]

[tasks."cleanup:bun"]
description = "cleanup cached files"
run = [
    "rm -rf ./node_modules",
    "bun pm cache rm",
]

[tasks."cleanup:logs"]
description = "remove log files"
run = "rm -rf ./logs"

[tasks."cleanup:test-results"]
description = "remove test result artifacts"
run = "rm -rf ./test-results"

[tasks.env-check]
description = "🔑 view secrets into the environment via varlock"
alias = "env"
depends = ["pass-login"]
run = "varlock load"

[tasks.dev]
description = "start the development server"
run = "npx varlock run -- nuxt dev"

[tasks.dummy]
description = "start dev server in dummy mode (no auth, mock data)"
env = { AUTH_MODE = "none", DUMMY = true }
run = "npx varlock run -- nuxt dev"

[tasks.automation]
description = "start dev server for automation/CI (disables changelog, disclaimer, onboarding)"
env = { NUXT_PUBLIC_COMMON_UI_DISABLE_CHANGELOG = true, NUXT_PUBLIC_COMMON_UI_DISABLE_DISCLAIMER = true, NUXT_PUBLIC_COMMON_UI_DISABLE_ONBOARDING = true, APP_MODE = "ci", AUTH_MODE = "none" }
run = "npx varlock run -- nuxt dev"
