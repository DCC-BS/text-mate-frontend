[tools]
bun = "1.3.14"
pass-cli = "latest"
node = "24.19.0"
"npm:varlock" = "1.16.1"
usage = "4.1.0"

[plugins]
pass-cli = "https://github.com/DCC-BS/mise-proton-pass-cli"

# System-level apt packages required to run the Playwright Chromium browser.
# Mirrors the chromium/tools lists in playwright-core's nativeDeps for Ubuntu.
# Applied via: mise bootstrap packages apply   (status: mise bootstrap packages status --missing)
[bootstrap.packages]
"apt:libasound2t64" = "latest"
"apt:libatk-bridge2.0-0t64" = "latest"
"apt:libatk1.0-0t64" = "latest"
"apt:libatspi2.0-0t64" = "latest"
"apt:libcairo2" = "latest"
"apt:libcups2t64" = "latest"
"apt:libdbus-1-3" = "latest"
"apt:libdrm2" = "latest"
"apt:libgbm1" = "latest"
"apt:libglib2.0-0t64" = "latest"
"apt:libnspr4" = "latest"
"apt:libnss3" = "latest"
"apt:libpango-1.0-0" = "latest"
"apt:libx11-6" = "latest"
"apt:libxcb1" = "latest"
"apt:libxcomposite1" = "latest"
"apt:libxdamage1" = "latest"
"apt:libxext6" = "latest"
"apt:libxfixes3" = "latest"
"apt:libxkbcommon0" = "latest"
"apt:libxrandr2" = "latest"
"apt:libfontconfig1" = "latest"
"apt:libfreetype6" = "latest"
"apt:fonts-liberation" = "latest"
"apt:fonts-noto-color-emoji" = "latest"
"apt:fonts-unifont" = "latest"
"apt:fonts-ipafont-gothic" = "latest"
"apt:fonts-wqy-zenhei" = "latest"
"apt:fonts-tlwg-loma-otf" = "latest"
"apt:fonts-freefont-ttf" = "latest"
"apt:xfonts-cyrillic" = "latest"
"apt:xfonts-scalable" = "latest"
"apt:xvfb" = "latest"

[hooks]
postinstall = { task = "install" }
enter = { task = "enter-checks" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
env = { APP_MODE = "build" }
description = "install npm packages"
run = '''
if [ "${DOCKER_BUILD:-}" = "1" ]; then
    bun install --frozen-lockfile
else
    bun install
    mise run playwright:install-browser
fi
'''

[tasks."playwright:install-browser"]
description = "install the Playwright browser matching the pinned @playwright/test version"
usage = 'flag "--with-deps" help="Also install OS-level dependencies via the system package manager"'
run = '''
bunx playwright install chromium ${usage_with_deps:+--with-deps}
'''

[tasks.env-check]
description = "🔑 Load secrets into the environment via varlock"
alias = "env"
depends = ["pass-login"]
run = "varlock load"

[tasks."nuxt:prepare"]
description = "generate Nuxt types"
run = "bunx nuxi prepare"

# ── Development ───────────────────────────────────────────────────────────────

[tasks.dev]
description = "start the development server"
run = "npx varlock run -- nuxt dev"

[tasks.debug]
description = "start dev server with the Node inspector attached"
run = "npx varlock run -- nuxt dev --inspect"

[tasks.dummy]
description = "start dev server in dummy mode (no auth, mock data)"
env = { AUTH_MODE = "none", DUMMY = true }
run = "npx varlock run -- nuxt dev"

[tasks.automation]
description = "start dev server for automation/CI (disables changelog, disclaimer, onboarding)"
env = { NUXT_PUBLIC_COMMON_UI_DISABLE_CHANGELOG = true, NUXT_PUBLIC_COMMON_UI_DISABLE_DISCLAIMER = true, NUXT_PUBLIC_COMMON_UI_DISABLE_ONBOARDING = true, APP_MODE = "ci", AUTH_MODE = "none" }
run = "npx varlock run -- nuxt dev"

# ── Build & Preview ───────────────────────────────────────────────────────────

[tasks.build]
description = "build the production bundle"
run = "bunx nuxt build"

[tasks.preview]
description = "preview the production build locally"
run = "bunx nuxt preview"

# ── Type Checking & Linting ───────────────────────────────────────────────────

[tasks.tsc]
description = "run TypeScript type checking"
run = "bunx vue-tsc --noEmit -p tsconfig.json"

[tasks.lint]
description = "format code with Biome"
run = "bunx biome format --write"

[tasks.check]
description = "check and fix linting issues"
run = "bunx biome check --fix"

[tasks."ci-check"]
description = "run type checking, linting"
run = "bunx biome ci ."

# ── Testing ───────────────────────────────────────────────────────────────────

[tasks."test:unit"]
env = { APP_MODE= "ci" }
description = "run unit tests"
alias = "test"
run = "bunx vitest"

[tasks."test:watch"]
env = { APP_MODE= "ci" }
description = "run unit tests in watch mode"
run = "bunx vitest --watch"

[tasks."test:coverage"]
description = "run unit tests with coverage report"
run = "bunx vitest run --coverage"

[tasks."e2e:build"]
env = { APP_MODE = "ci", AUTH_MODE = "none", DUMMY = true }
description = "build the production bundle for E2E tests (reuses prebuilt .output in CI)"
run = 'if [ "${CI:-}" = "true" ] && [ -d .output ]; then echo "e2e:build: reusing prebuilt .output"; else bunx nuxt build; fi'

[tasks."e2e:serve"]
description = "serve the E2E production build on port 4300 (dummy data, overlays disabled)"
env = { APP_MODE = "ci", AUTH_MODE = "none", DUMMY = true, PORT = "4300", NUXT_PUBLIC_COMMON_UI_DISABLE_CHANGELOG = true, NUXT_PUBLIC_COMMON_UI_DISABLE_DISCLAIMER = true, NUXT_PUBLIC_COMMON_UI_DISABLE_ONBOARDING = true }
run = "node .output/server/index.mjs"

[tasks."test:e2e"]
env = { APP_MODE = "ci" }
description = "run Playwright E2E tests (builds first, serves on port 4300)"
depends = ["e2e:build"]
run = "bunx playwright test"

[tasks."test:e2e:ui"]
env = { APP_MODE = "ci" }
description = "run Playwright E2E tests with the interactive UI"
depends = ["e2e:build"]
run = "bunx playwright test --ui"

[tasks."e2e:codegen"]
env = { APP_MODE = "ci" }
description = "generate Playwright tests via codegen (requires a running e2e:serve)"
run = "bunx playwright codegen http://localhost:4300"

# ── Docker ────────────────────────────────────────────────────────────────────

[tasks."docker:up"]
description = "build and start the dev Docker containers"
dir = "{{config_root}}/docker"
run = "bunx varlock run -- docker compose -f docker-compose.dev.yml up --build -d"

[tasks."docker:down"]
description = "stop the dev Docker containers"
dir = "{{config_root}}/docker"
run = "bunx varlock run -- docker compose -f docker-compose.dev.yml down"

# ── Versioning ────────────────────────────────────────────────────────────────

[tasks.version]
description = "Bump package version (patch, minor, or major)"
usage = '''
arg "<bump>" help="Version bump type: patch, minor, or major"
'''
run = "bun pm version ${usage_bump}"

# ── Cleanup ───────────────────────────────────────────────────────────────────

[tasks."cleanup:layers"]
description = "cleanup layer files"
run = [
    "rm -rf ./node_modules/.*c12",
    "rm -rf ./node_modules/c12",
]

[tasks."cleanup:bun"]
description = "cleanup cached files"
run = [
    "rm -rf ./node_modules",
    "bun pm cache rm",
]

[tasks."cleanup:logs"]
description = "remove log files"
run = "rm -rf ./logs"

[tasks."cleanup:test-results"]
description = "remove test result artifacts"
run = "rm -rf ./test-results"
