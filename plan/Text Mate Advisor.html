document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-700: #723d8e;\n    --color-purple-800: #5f3375;\n    --color-purple-900: #512e61;\n\n    /* ---- Teal (secondary) ---- */\n    --color-teal-50: #f2fcfa;\n    --color-teal-100: #cff5ef;\n    --color-teal-200: #9aeadc;\n    --color-teal-300: #5bdcc5;\n    --color-teal-400: #29c9a9;\n    --color-teal-500: #00b590;\n    --color-teal-600: #009a79;\n    --color-teal-700: #007d63;\n    --color-teal-800: #005f4a;\n    --color-teal-900: #004c3b;\n\n    /* ---- Blue (info / default action) ---- */\n    --color-blue-50: #f2fdff;\n    --color-blue-100: #dbf9ff;\n    --color-blue-200: #b6edfa;\n    --color-blue-300: #85d4ee;\n    --color-blue-400: #51b9da;\n    --color-blue-500: #079bca;\n    --color-blue-600: #0e81a7;\n    --color-blue-700: #146c8b;\n    --color-blue-800: #1b5268;\n    --color-blue-900: #1e4557;\n\n    /* ---- Green (success) ---- */\n    --color-green-50: #f2f7f3;\n    --color-green-100: #ddecde;\n    --color-green-200: #b8d6be;\n    --color-green-300: #7bb589;\n    --color-green-400: #469a5d;\n    --color-green-500: #2a9749;\n    --color-green-600: #32834a;\n    --color-green-700: #2a713f;\n    --color-green-800: #245333;\n    --color-green-900: #1f402a;\n\n    /* ---- Red (error / failure) ---- */\n    --color-red-50: #fff1ef;\n    --color-red-100: #ffe0dc;\n    --color-red-200: #ffc7bf;\n    --color-red-300: #ff9f92;\n    --color-red-400: #ff6854;\n    --color-red-500: #ff3a1f;\n    --color-red-600: #ff1e00;\n    --color-red-700: #db1a00;\n    --color-red-800: #b81600;\n    --color-red-900: #941908;\n\n    /* ---- Yellow (warning / data.bs accent) ---- */\n    --color-yellow-50: #fffdf2;\n    --color-yellow-100: #fff5cc;\n    --color-yellow-200: #ffe699;\n    --color-yellow-300: #ffcf4d;\n    --color-yellow-400: #ffbb1a;\n    --color-yellow-500: #ffaa00;\n    --color-yellow-600: #e69500;\n    --color-yellow-700: #b37700;\n    --color-yellow-800: #805900;\n    --color-yellow-900: #664700;\n\n    /* ---- Brown (tertiary / earthy) ---- */\n    --color-brown-5 n\n    /* Borders */\n    --border-default: var(--color-gray-200);\n    --border-strong: var(--color-gray-300);\n    --border-action: var(--color-blue-900);\n    --border-focus: var(--color-blue-900);\n\n    /* Editor / diff (TextMate) */\n    --diff-added-bg: var(--color-green-100);\n    --diff-removed-bg: var(--color-red-100);\n    --focus-sentence-bg: var(--color-blue-100);\n    --focus-word-fg: var(--color-blue-500);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TYPOGRAPHY — Inter only. The Kanton BS scale is fluid:\n   headings step up at the md (768) and xl (1210) breakpoints.\n   The px tokens below capture the desktop (xl) end of each step.\n   ============================================================ */\n\n:root {\n    /* Family */\n    --font-sans: \"Inter\", \"Inter Fallback\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    /* Tiptap code blocks render mono; not part of brand chrome. */\n    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n    /* Weights — only three are shipped */\n    --font-weight-regular: 400;\n    --font-weight-medium: 500;\n    --font-weight-bold: 700;\n\n    /* Raw size ramp (px) */\n    --text-xs: 12px;\n    --text-sm: 14px;\n    --text-base: 16px;\n    --text-lg: 18px;\n    --text-xl: 20px;\n    --text-2xl: 24px;\n    --text-3xl: 30px;\n    --text-4xl: 36px;\n    --text-5xl: 48px;\n    --text-6xl: 60px;\n\n    /* Line heights */\n    --leading-none: 1;\n    --leading-tight: 1.2;\n    --leading-snug: 1.3;\n    --leading-normal: 1.4;\n\n    /* ---- Semantic type roles (desktop sizes) ---- */\n    /* h1  — page title */\n    --type-h1-size: var(--text-5xl);\n    --type-h1-weight: var(--font-weight-bold);\n    --type-h1-leading: var(--leading-tight);\n    /* h2  — section heading */\n    --type-h2-size: var(--text-4xl);\n    --type-h2-weight: var(--font-weight-bold);\n    --type-h2-leading: var(--leading-tight);\n    /* h3  — subsection */\n    --type-h3-size: var(--text-2xl);\n    --type-h3-weight: var(--font-weight-bold);\n    --type-h3-leading: var(--leading-snug);\n    /* h4  — small heading */\n    --type-h4-size: var(--text-xl);\n    --type-h4-weight: var(--font-weight-bold);\n    --type-h4-leading: var(--leading-snug);\n    /* lead — intro paragraph */\n    --type-lead-size: var(--text-2xl);\n    --type-lead-weight: var(--font-weight-bold);\n    --type-lead-leading: var(--leading-normal);\n    /* pre-heading — eyebrow / kicker label */\n    --type-preheading-size: var(--text-sm);\n    --type-preheading-weight: var(--font-weight-bold);\n    /* body */\n    --type-body-size: var(--text-xl);\n    --type-body-weight: var(--font-weight-regular);\n    --type-body-leading: var(--leading-normal);\n    /* body-small / UI text */\n    --type-ui-size: var(--text-base);\n    --type-ui-weight: var(--font-weight-regular);\n    --type-ui-leading: var(--leading-normal);\n    /* caption / meta */\n    --type-caption-size: var(--text-sm);\n    --type-caption-weight: var(--font-weight-regular);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SPACING, RADII, SHADOWS, LAYOUT\n   Kanton BS uses a px-based spacing scale and a small set of\n   radii. The signature elevation is a soft purple GLOW (not a\n   drop shadow) used on focused / active interactive surfaces.\n   ============================================================ */\n\n:root {\n    /* ---- Spacing scale (px) ---- */\n    --space-0: 0px;\n    --space-1: 1px;\n    --space-2: 2px;\n    --space-3: 3px;\n    --space-5: 5px;\n    --space-6: 6px;\n    --space-8: 8px;\n    --space-10: 10px;\n    --space-15: 15px;\n    --space-20: 20px;   /* default gap between elements */\n    --space-25: 25px;\n    --space-30: 30px;\n    --space-35: 35px;\n    --space-40: 40px;\n    --space-50: 50px;\n    --space-60: 60px;\n    --space-70: 70px;\n    --space-80: 80px;\n    --space-90: 90px;\n    --space-100: 100px;\n\n    /* Default stack/in lor-green-700: #2a713f;\n    --color-green-800: #245333;\n    --color-green-900: #1f402a;\n\n    /* ---- Red (error / failure) ---- */\n    --color-red-50: #fff1ef;\n    --color-red-100: #ffe0dc;\n    --color-red-200: #ffc7bf;\n    --color-red-300: #ff9f92;\n    --color-red-400: #ff6854;\n    --color-red-500: #ff3a1f;\n    --color-red-600: #ff1e00;\n    --color-red-700: #db1a00;\n    --color-red-800: #b81600;\n    --color-red-900: #941908;\n\n    /* ---- Yellow (warning / data.bs accent) ---- */\n    --color-yellow-50: #fffdf2;\n    --color-yellow-100: #fff5cc;\n    --color-yellow-200: #ffe699;\n    --color-yellow-300: #ffcf4d;\n    --color-yellow-400: #ffbb1a;\n    --color-yellow-500: #ffaa00;\n    --color-yellow-600: #e69500;\n    --color-yellow-700: #b37700;\n    --color-yellow-800: #805900;\n    --color-yellow-900: #664700;\n\n    /* ---- Brown (tertiary / earthy) ---- */\n    --color-brown-50: #faf6f4;\n    --color-brown-100: #f0e4dd;\n    --color-brown-200: #dcc3b0;\n    --color-brown-300: #bf9a7a;\n    --color-brown-400: #a57251;\n    --color-brown-500: #8b5734;\n    --color-brown-600: #73472a;\n    --color-brown-700: #5b3821;\n    --color-brown-800: #45301b;\n    --color-brown-900: #362718;\n\n    /* ---- Gray (neutrals) ---- */\n    --color-gray-20: #f8f8f8;\n    --color-gray-50: #f2f2f2;\n    --color-gray-100: #ebebeb;\n    --color-gray-200: #e3e3e3;\n    --color-gray-300: #bababa;\n    --color-gray-400: #a5a5a5;\n    --color-gray-500: #949494;\n    --color-gray-600: #777777;\n    --color-gray-700: #535353;\n    --color-gray-800: #403f3f;\n    --color-gray-900: #333333;\n\n    /* ---- Monochrome ---- */\n    --color-white: #ffffff;\n    --color-black: #000000;\n\n    /* ============================================================\n       SEMANTIC ALIASES — reference these in product code.\n       ============================================================ */\n\n    /* Brand */\n    --ui-primary: var(--color-purple-600);\n    --ui-primary-strong: var(--color-purple-900);\n    --ui-primary-soft: var(--color-purple-200);\n    --ui-primary-subtle: var(--color-purple-100);\n    --ui-secondary: var(--color-teal-600);\n    --ui-accent: var(--color-yellow-500);\n\n    /* Status */\n    --ui-success: var(--color-green-600);\n    --ui-info: var(--color-blue-600);\n    --ui-warning: var(--color-yellow-600);\n    --ui-error: var(--color-red-700);\n\n    /* Text */\n    --text-body: var(--color-gray-900);\n    --text-muted: var(--color-gray-600);\n    --text-subtle: var(--color-gray-500);\n    --text-inverted: var(--color-white);\n    --text-link: var(--color-purple-600);\n    --text-on-dark-action: var(--color-blue-900);\n\n    /* Surfaces */\n    --surface-page: var(--color-white);\n    --surface-muted: var(--color-gray-20);\n    --surface-card: var(--color-white);\n    --surface-sunken: var(--color-gray-50);\n    --surface-inverted: var(--color-gray-900);\n\n    /* Borders */\n    --border-default: var(--color-gray-200);\n    --border-strong: var(--color-gray-300);\n    --border-action: var(--color-blue-900);\n    --border-focus: var(--color-blue-900);\n\n    /* Editor / diff (TextMate) */\n    --diff-added-bg: var(--color-green-100);\n    --diff-removed-bg: var(--color-red-100);\n    --focus-sentence-bg: var(--color-blue-100);\n    --focus-word-fg: var(--color-blue-500);\n}\n\n/* ============================================================\n   TYPOGRAPHY — Inter only. The Kanton BS scale is fluid:\n   headings step up at the md (768) and xl (1210) breakpoints.\n   The px tokens below capture the desktop (xl) end of each step.\n   ============================================================ */\n\n:root {\n    /* Family */\n    --font-sans: \"Inter\", \"Inter Fallback\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    /* Tiptap code blocks render mono; not part of brand chrome. */\n    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n    /* Weights — only three are shipped */\n    --font-weight-regular: 400;\n    --font-weight-medium: 500;\n    --font-weight-bold: 700;\n\n    /* Raw size ramp (px) */\n    --text-xs: 12px;\n    --text-sm: 14px;\n    --text-base: 16px;\n    --text-lg: 18px;\n    --text-xl: 20px;\n    --text-2xl: 24px;\n    --text-3xl: 30px;\n    --text-4xl: 36px;\n    --text-5xl: 48px;\n    --text-6xl: 60px;\n\n    /* Line heights */\n    --leading-none: 1;\n    --leading-tight: 1.2;\n    --leading-snug: 1.3;\n    --leading-normal: 1.4;\n\n    /* ---- Semantic type roles (desktop sizes) ---- */\n    /* h1  — page title */\n    --type-h1-size: var(--text-5xl);\n    --type-h1-weight: var(--font-weight-bold);\n    --type-h1-leading: var(--leading-tight);\n    /* h2  — section heading */\n    --type-h2-size: var(--text-4xl);\n    --type-h2-weight: var(--font-weight-bold);\n    --type-h2-leading: var(--leading-tight);\n    /* h3  — subsection */\n    --type-h3-size: var(--text-2xl);\n    --type-h3-weight: var(--font-weight-bold);\n    --type-h3-leading: var(--leading-snug);\n    /* h4  — small heading */\n    --type-h4-size: var(--text-xl);\n    --type-h4-weight: var(--font-weight-bold);\n    --type-h4-leading: var(--leading-snug);\n    /* lead — intro paragraph */\n    --type-lead-size: var(--text-2xl);\n    --type-lead-weight: var(--font-weight-bold);\n    --type-lead-leading: var(--leading-normal);\n    /* pre-heading — eyebrow / kicker label */\n    --type-preheading-size: var(--text-sm);\n    --type-preheading-weight: var(--font-weight-bold);\n    /* body */\n    --type-body-size: var(--text-xl);\n    --type-body-weight: var(--font-weight-regular);\n    --type-body-leading: var(--leading-normal);\n    /* body-small / UI text */\n    --type-ui-size: var(--text-base);\n    --type-ui-weight: var(--font-weight-regular);\n    --type-ui-leading: var(--leading-normal);\n    /* caption / meta */\n    --type-caption-size: var(--text-sm);\n    --type-caption-weight: var(--font-weight-regular);\n}\n\n/* ============================================================\n   SPACING, RADII, SHADOWS, LAYOUT\n   Kanton BS uses a px-based spacing scale and a small set of\n   radii. The signature elevation is a soft purple GLOW (not a\n   drop shadow) used on focused / active interactive surfaces.\n   ============================================================ */\n\n:root {\n    /* ---- Spacing scale (px) ---- */\n    --space-0: 0px;\n    --space-1: 1px;\n    --space-2: 2px;\n    --space-3: 3px;\n    --space-5: 5px;\n    --space-6: 6px;\n    --space-8: 8px;\n    --space-10: 10px;\n    --space-15: 15px;\n    --space-20: 20px;   /* default gap between elements */\n    --space-25: 25px;\n    --space-30: 30px;\n    --space-35: 35px;\n    --space-40: 40px;\n    --space-50: 50px;\n    --space-60: 60px;\n    --space-70: 70px;\n    --space-80: 80px;\n    --space-90: 90px;\n    --space-100: 100px;\n\n    /* Default stack/inline gap */\n    --gap-default: 20px;\n\n    /* ---- Border radius ---- */\n    --radius-none: 0px;\n    --radius-default: 4px;     /* inputs, cards, tags */\n    --radius-large: 10px;      /* panels, dialogs */\n    --radius-button: 20px;     /* pill buttons (base size) */\n    --radius-button-sm: 15px;  /* pill buttons (small size) */\n    --radius-full: 9999px;     /* avatars, dots, chips */\n\n    /* ---- Border widths ---- */\n    --border-width: 1px;\n    --border-width-strong: 2px;\n    --border-width-heavy: 3px;\n\n    /* ---- Shadows ---- */\n    /* Signature purple glow — focus / active / hover emphasis */\n    --shadow-glow: 0 0 10px 0 #9156b4;\n    --shadow-glow-sm: 0 0 5px 0 #9156b4;\n    --shadow-glow-white: 0 0 10px 0 #ffffff;\n    /* Conventional soft elevation for floating UI (popovers, menus) */\n    --shadow-sm: 0 1px 2px 0 rgba(51, 51, 51, 0.08);\n    --shadow-md: 0 4px 12px -2px rgba(51, 51, 51, 0.12);\n    --shadow-lg: 0 10px 30px -6px rgba(51, 51, 51, 0.18);\n\n    /* ---- Focus ring ---- */\n    --focus-ring: 3px solid var(--color-blue-900);\n\n    /* ---- Layout maxima ---- */\n    --max-prose: 836px;   /* readable text column */\n    --max-box: 610px;     /* form / dialog box */\n    --max-reduced: 970px; /* reduced content width */\n\n    /* ---- Motion ---- */\n    --duration-fast: 150ms; /* @kind other */\n    --duration-base: 250ms; /* @kind other */\n    --duration-slow: 400ms; /* @kind other */\n    --ease-swing: cubic-bezier(0.56, 0.04, 0.25, 1); /* @kind other */\n    --ease-momentum: cubic-bezier(1, -0.76, 0.46, 1.01); /* @kind other */\n}\n\n/* ---- Breakpoints (reference; not custom properties) ----\n   sm  : 480px\n   md  : 768px\n   lg  : 1024px\n   xl  : 1210px\n   xxl : 1920px\n   ----------------------------------------------------------- */\n\n/* ============================================================\n   BASE — light element defaults so cards & kits render the\n   brand without per-file resets. Mirrors common-ui html.css.\n   ============================================================ */\n\n:root {\n    color-scheme: light;\n}\n\nhtml {\n    font-family: var(--font-sans);\n    color: var(--text-body);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    scroll-behavior: smooth;\n}\n\n@media (prefers-reduced-motion: reduce) {\n    html {\n        scroll-behavior: auto;\n    }\n}\n\nbody {\n    margin: 0;\n    background: var(--surface-page);\n    font-size: var(--type-ui-size);\n    line-height: var(--type-ui-leading);\n}\n\n*,\n*::before,\n*::after {\n    box-sizing: border-box;\n}\n\na {\n    color: var(--text-link);\n    text-decoration: none;\n}\n\na:hover {\n    text-decoration: underline;\n}\n\n::selection {\n    background: var(--color-purple-200);\n}\n\n<\u002Fstyle>\n<script src=\"5477e97e-417b-4d1b-b391-89a15ef5238a\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--color-white);color:var(--color-gray-900);}\n  ::selection{background:var(--color-purple-200);}\n  textarea::placeholder,input::placeholder{color:var(--color-gray-400);}\n  button{font-family:inherit;}\n  ::-webkit-scrollbar{width:11px;height:11px;}\n  ::-webkit-scrollbar-thumb{background:var(--color-gray-300);border-radius:6px;border:3px solid var(--color-white);}\n  @keyframes tmspin{to{transform:rotate(360deg);}}\n  @keyframes tmfade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:relative;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--color-white);font-size:15px;\">\n\n  <header style=\"height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--color-white);border-bottom:1px solid var(--color-gray-200);\">\n    <div style=\"display:flex;align-items:center;gap:10px;\">\n      <span style=\"color:var(--color-gray-900);display:flex;\">{{ ico.brand }}<\u002Fspan>\n      <span style=\"font-size:21px;font-weight:700;letter-spacing:-0.01em;color:var(--color-gray-900);\">TextMate<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;\">\n      <button style=\"display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--color-gray-700);padding:6px 4px;\"><span style=\"color:var(--color-gray-600);display:flex;\">{{ ico.alert }}<\u002Fspan>Disclaimer<\u002Fbutton>\n      <button style=\"display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--color-gray-700);padding:6px 4px;\"><span style=\"font-weight:600;\">DE<\u002Fspan><span style=\"color:var(--color-gray-600);display:flex;\">{{ ico.chev }}<\u002Fspan><\u002Fbutton>\n      <span style=\"width:9px;height:9px;border-radius:50%;background:var(--color-green-500);\"><\u002Fspan>\n      <button style=\"display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9999px;background:none;border:none;cursor:pointer;color:var(--color-gray-600);\">{{ ico.help }}<\u002Fbutton>\n      <span style=\"width:34px;height:34px;border-radius:9999px;background:var(--color-purple-100);color:var(--color-purple-700);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;\">BS<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex-shrink:0;background:var(--color-white);border-bottom:1px solid var(--color-gray-200);padding:9px 24px;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;\">\n      <div style=\"display:flex;gap:6px;\">\n        <button onclick=\"{{ onSelectRewrite }}\" style=\"{{ tabRewriteStyle }}\">Umschreiben<\u002Fbutton>\n        <button onclick=\"{{ onSelectAdvisor }}\" style=\"{{ tabAdvisorStyle }}\">Überprüfen<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <button style=\"display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--color-gray-700);padding:6px 8px;border-radius:4px;\"><span style=\"color:var(--color-gray-600);display:flex;\">{{ ico.lang }}<\u002Fspan><span>Deutsch<\u002Fspan><span style=\"color:var(--color-gray-500);display:flex;\">{{ ico.chev }}<\u002Fspan><\u002Fbutton>\n        <button style=\"display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:14px;padding:6px 8px;border-radius:4px;\"><span style=\"color:var(--color-purple-600);display:flex;\">{{ ico.bookOpen }}<\u002Fspan><span style=\"color:var(--color-purple-700);\">Wörterbuch<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isAdvisor }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex-shrink:0;background:var(--color-gray-20);border-bottom:1px solid var(--color-gray-200);padding:10px 24px;\">\n    <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n      <span style=\"font-size:13px;font-weight:700;color:var(--color-gray-700);\">Dokumentenberater<\u002Fspan>\n      <div style=\"position:relative;\">\n        <button onclick=\"{{ onToggleDocMenu }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:240px;height:38px;padding:0 12px;background:var(--color-white);border:1px solid var(--color-blue-900);border-radius:4px;cursor:pointer;font-size:14px;color:var(--color-gray-900);\">\n          <span>{{ docButtonLabel }}<\u002Fspan><span style=\"color:var(--color-gray-500);display:flex;\">{{ ico.chev }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ docMenuOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:300px;background:var(--color-white);border:1px solid var(--color-gray-200);border-radius:4px;box-shadow:var(--shadow-md);padding:4px;\">\n            <sc-for list=\"{{ docOptions }}\" as=\"d\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ d.onToggle }}\" style=\"display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;border-radius:4px;cursor:pointer;font-size:14px;text-align:left;color:var(--color-gray-800);\">\n                <span style=\"{{ d.boxStyle }}\">{{ d.check }}<\u002Fspan><span>{{ d.title }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <div style=\"padding:7px 10px 3px;font-size:11px;color:var(--color-gray-500);\">Max. 5 Dokumente<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button onclick=\"{{ onCheck }}\" style=\"{{ checkBtnStyle }}\">{{ checkLabel }}<\u002Fbutton>\n\n      <div style=\"flex:1;\"><\u002Fdiv>\n\n      <sc-if value=\"{{ showResults }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <span style=\"font-size:13px;color:var(--color-gray-600);\">Ergebnisse<\u002Fspan>\n          <span style=\"{{ problemBadgeStyle }}\">{{ problemBadgeText }}<\u002Fspan>\n          <div style=\"position:relative;\">\n            <button onclick=\"{{ onToggleBulkMenu }}\" title=\"Sammelaktionen\" style=\"display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;background:none;border:1px solid var(--color-gray-200);cursor:pointer;color:var(--color-gray-600);\">{{ ico.dots }}<\u002Fbutton>\n            <sc-if value=\"{{ bulkMenuOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"position:absolute;top:calc(100% + 4px);right:0;z-index:50;min-width:190px;background:var(--color-white);border:1px solid var(--color-gray-200);border-radius:4px;box-shadow:var(--shadow-md);padding:4px;\">\n                <button onclick=\"{{ onBulkFix }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:none;background:none;border-radius:4px;cursor:pointer;font-size:13.5px;text-align:left;color:var(--color-gray-800);\"><span style=\"color:var(--color-purple-600);display:flex;\">{{ ico.check }}<\u002Fspan>Alle korrigieren<\u002Fbutton>\n                <button onclick=\"{{ onBulkSkip }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:none;background:none;border-radius:4px;cursor:pointer;font-size:13.5px;text-align:left;color:var(--color-gray-800);\"><span style=\"color:var(--color-gray-500);display:flex;\">{{ ico.eyeOff }}<\u002Fspan>Alle ignorieren<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ checking }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:10px;height:5px;border-radius:3px;background:var(--color-gray-100);overflow:hidden;\"><div style=\"{{ progressStyle }}\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;min-height:0;posit   const hunks = []; let cursor = 0; let k = 0;\n    reps.forEach(r => {\n      if (r.idx < cursor) return;\n      if (r.idx > cursor) hunks.push({ id: \"h\" + (k++), kind: \"same\", text: text.slice(cursor, r.idx) });\n      hunks.push({ id: \"h\" + (k++), kind: \"rep\", rm: r.find, add: r.replace, accepted: true });\n      cursor = r.idx + r.find.length;\n    });\n    if (cursor < text.length) hunks.push({ id: \"h\" + (k++), kind: \"same\", text: text.slice(cursor) });\n    return hunks;\n  }\n  toggleHunk(id, val) { this.setState(s => ({ diffHunks: s.diffHunks.map(h => h.id === id ? { ...h, accepted: val } : h) })); }\n  applyAll(val) { this.setState(s => ({ diffHunks: s.diffHunks.map(h => h.kind === \"rep\" ? { ...h, accepted: val } : h) })); }\n  confirmDiff() {\n    const text = this.state.diffHunks.map(h => h.kind === \"same\" ? h.text : (h.accepted ? h.add : h.rm)).join(\"\");\n    this.setState({ text, phase: \"done\", threads: [], focusedId: null, diffHunks: [] });\n    this.showToast(\"Überarbeitung übernommen\");\n  }\n  rejectDiff() { this.setState({ phase: \"review\", diffHunks: [] }); }\n  setDir(direction) { this.setState({ direction }, () => this.layout()); }\n\n  // ---- render ----\n  renderVals() {\n    const s = this.state;\n    const th = TH[s.direction] || TH.A;\n    const ico = this.icoSet;\n    const isAdvisor = s.tool === \"advisor\";\n    const isRewrite = s.tool === \"rewrite\";\n    const checking = s.phase === \"checking\";\n    const showDiff = s.phase === \"diff\";\n    const applying = s.phase === \"applying\";\n    const isDone = s.phase === \"done\";\n    const showReview = isAdvisor && !showDiff && (s.phase === \"review\" || s.phase === \"checking\" || s.phase === \"done\" || s.phase === \"idle\");\n\n    const tabStyle = (active) => ({\n      padding: \"6px 16px\", borderRadius: \"15px\", border: \"none\", cursor: \"pointer\", fontSize: \"15px\", fontWeight: 500,\n      background: active ? \"var(--color-purple-100)\" : \"transpar  }; }\n    else if (count === 0) { problemBadgeText = \"Keine Probleme\"; badgeColor = { bg: \"var(--color-green-100)\", fg: \"var(--color-green-800)\" }; }\n    const problemBadgeStyle = { display: \"inline-flex\", alignItems: \"center\", padding: \"3px 11px\", borderRadius: \"9999px\", fontSize: 12.5, fontWeight: 600, background: badgeColor.bg, color: badgeColor.fg };\n\n    // segments\n    const segments = this.buildSegments(th);\n\n    // cards\n    const cards = s.threads.slice().sort((a, b) => a.range.start - b.range.start).map(t => this.cardVM(t, th, ico));\n\n    // bubble / popover\n    const b = s.bubble;\n    const bubbleStyle = b ? { position: \"absolute\", left: b.x, top: b.y, transform: \"translateX(-50%)\", zIndex: 45, background: \"var(--color-white)\", border: \"1px solid var(--color-gray-200)\", borderRadius: \"8px\", boxShadow: \"var(--shadow-md)\", animation: \"tmfade .15s var(--ease-swing)\" } : {};\n    const pp = s.popover;\n    const popoverStyle = pp ? { position: \"absolute\", left: Math.max(8, pp.x - 150), top: pp.y, width: 300, zIndex: 46, background: \"var(--color-white)\", border: \"1px solid var(--color-gray-200)\", borderRadius: \"10px\", boxShadow: \"var(--shadow-lg)\", padding: 14, animation: \"tmfade .15s var(--ease-swing)\" } : {};\n\n    // diff\n    const diffHunks = s.diffHunks.map(h => {\n      if (h.kind === \"same\") return { isSame: true, isRep: false, text: h.text };\n      const accepted = h.accepted;\n      const delStyle = accepted\n        ? { textDecoration: \"line-through\", color: \"var(--color-gray-400)\", background: \"var(--color-red-50)\", padding: \"0 2px\", borderRadius: 2 }\n        : { color: \"var(--color-gray-900)\", borderBottom: \"2px dotted var(--color-gray-300)\" };\n      const miniBtn = (on, kind) => ({ display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\", width: 19, height: 19, borderRadius: 5, border: \"none\", cursor: \"pointer\", padding: 0, background: on ? (kind === \"acc\" ? \"var(--color-green-600)\" : \"var(--color-gray-400)\") : \"var(--color-gray-100)\", color: on ? \"#fff\" : \"var(--color-gray-500)\" });\n      return {\n        isSame: false, isRep: true, accepted, rm: h.rm, add: h.add,\n        delStyle, addStyle: { background: \"var(--color-green-100)\", color: \"var(--color-green-800)\", padding: \"0 3px\", borderRadius: 2 },\n        accBtn: miniBtn(accepted, \"acc\"), rejBtn: miniBtn(!accepted, \"rej\"),\n        onAcc: () => this.toggleHunk(h.id, true), onRej: () => this.toggleHunk(h.id, false),\n      };\n    });\n    const repTotal = s.diffHunks.filter(h => h.kind === \"rep\").length;\n    const repAcc = s.diffHunks.filter(h => h.kind === \"rep\" && h.accepted).length;\n    const diffSummary = repAcc + \" von \" + repTotal + \" Änderungen übernommen\";\n\n    // footer\n    let footerVisible = false, footerSummary = \"\", ctaLabel = \"\", onCta = () => {}, ctaDisabled = false, hasSecondary = false, secondaryLabel = \"\", onSecondary = () => {};\n    if (isAdvisor && s.phase === \"review\" && count > 0) {\n      footerVisible = true;\n      footerSummary = toFix + \" zu korrigieren · \" + skipped + \" ignoriert\";\n      ctaLabel = \"Text überarbeiten\" + (toFix ? \" (\" + toFix + \")\" : \"\");\n      ctaDisabled = toFix === 0; onCta = () => this.applyFix();\n    } else if (showDiff) {\n      footerVisible = true; footerSummary = diffSummary;\n      hasSecondary = true; secondaryLabel = \"Verwerfen\"; onSecondary = () => this.rejectDiff();\n      ctaLabel = \"Übernehmen\"; onCta = () => this.confirmDiff();\n    } else if (isDone) {\n      footerVisible = true; footerSummary = \"Runde abgeschlossen\";\n      ctaLabel = \"Erneut prüfen\"; onCta = () => this.check();\n    }\n    const ctaStyle = {\n      display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\", minHeight: 40, padding: \"0 22px\",\n      borderRadius: \"20px\", border: \"1px solid \" + (ctaDisabled ? \"var(--color-gray-300)\" : \"var(--color-purple-600)\"),\n      background: ctaDisabled ? \"var(--color-gray-300)\" : \"var(--color-purple-600)\", color: ctaDisabled ? \"var(--color-gray-600)\" : \"#fff\",\n      fontSize: 14.5, fontWeight: 500, cursor: ctaDisabled ? \"not-allowed\" : \"pointer\", transition: \"background .2s\",\n    };\n\n    const dirChip = (on) => ({ padding: \"5px 11px\", borderRadius: \"9999px\", border: \"none\", cursor: \"pointer\", fontSize: 11.5, fontWeight: 600, background: on ? \"var(--color-white)\" : \"transparent\", color: on ? \"var(--color-purple-700)\" : \"var(--color-gray-500)\", boxShadow: on ? \"var(--shadow-sm)\" : \"none\", transition: \"all .2s\" });\n\n    return {\n      ico, isAdvisor, isRewrite, checking, showDiff, applying, isDone, showReview,\n      text: s.text, onRewriteInput: (e) => this.setState({ text: e.target.value }),\n      tabRewriteStyle: tabStyle(isRewrite), tabAdvisorStyle: tabStyle(isAdvisor),\n      onSelectRewrite: () => this.selectTool(\"rewrite\"), onSelectAdvisor: () => this.selectTool(\"advisor\"),\n      docButtonLabel, docMenuOpen: s.docMenuOpen, onToggleDocMenu: () => this.toggleDocMenu(), docOptions,\n      checkBtnStyle, checkLabel: checking ? \"Wird geprüft…\" : \"Text überprüfen\", onCheck: () => this.check(),\n      showResults, problemBadgeText, problemBadgeStyle,\n      bulkMenuOpen: s.bulkMenuOpen, onToggleBulkMenu: () => this.toggleBulkMenu(), onBulkFix: () => this.bulkSet(\"to-fix\"), onBulkSkip: () => this.bulkSet(\"skip\"),\n      progressStyle: { height: \"100%\", background: \"var(--color-purple-600)\", width: s.progress + \"%\", transition: \"width .15s linear\" },\n      setWorkRef: this.setWorkRef, setContentRef: this.setContentRef, setDocRef: this.setDocRef, setProseRef: this.setProseRef, setCardsRef: this.setCardsRef, setSvgRef: this.setSvgRef,\n      onProseMouseUp: this.onProseMouseUp, segments, cards,\n      noThreads: showReview && count === 0 && !checking,\n      emptyText: checking ? \"Analysiere Text…\" : (isDone ? \"Keine offenen Hinweise.\" : \"Keine Probleme gefunden.\"),\n      bubbleVisible: !!b, bubbleStyle, onAddComment: () => this.addComment(),\n      popoverVisible: !!pp, popoverStyle, popoverTitle: pp && pp.mode === \"reply\" ? \"Auf Kommentar antworten\" : \"Neuer Kommentar\",\n      popoverDraft: pp ? pp.draft : \"\", popoverSubmitLabel: pp && pp.mode === \"reply\" ? \"Antworten\" : \"Hinzufügen\",\n      onPopoverChange: (e) => this.popoverChange(e.target.value), onPopoverSubmit: () => this.popoverSubmit(), onPopoverCancel: () => this.popoverCancel(),\n      diffHunks, diffSummary, onApplyAll: () => this.applyAll(true), onUndoAll: () => this.applyAll(false),\n      footerVisible, footerSummary, ctaLabel, ctaStyle, onCta, hasSecondary, secondaryLabel, onSecondary,\n      dirAStyle: dirChip(s.direction === \"A\"), dirBStyle: dirChip(s.direction === \"B\"), onSetDirA: () => this.setDir(\"A\"), onSetDirB: () => this.setDir(\"B\"),\n      toastVisible: !!s.toast, toast: s.toast,\n    };\n  }\n\n  buildSegments(th) {\n    const text = this.state.text;\n    const threads = this.state.threads;\n    if (!threads.length) return [{ text, markAttr: \"0\", threadId: \"\", style: {}, onClick: null }];\n    const bounds = new Set([0, text.length]);\n    threads.forEach(t => { bounds.add(Math.max(0, Math.min(text.length, t.range.start))); bounds.add(Math.max(0, Math.min(text.length, t.range.end))); });\n    const arr = Array.from(bounds).sort((a, b) => a - b);\n    const out = [];\n    for (let i = 0; i < arr.length - 1; i++) {\n      const a = arr[i], bb = arr[i + 1]; if (a >= bb) continue;\n      const covering = threads.filter(t => t.range.start <= a && t.range.end >= bb);\n      const part = text.slice(a, bb);\n      if (covering.length) {\n        const primary = covering[covering.length - 1];\n        const focused = covering.some(t => t.id === this.state.focusedId);\n        const skip = covering.every(t => t.status === \"skip\");\n        out.push({ text: par x solid \" + (focused ? \"var(--color-purple-700)\" : \"var(--color-purple-600)\"); }\n    if (skip) { root.opacity = 0.5; root.filter = \"grayscale(0.5)\"; }\n\n    const text = s.text;\n    const fix = t.status === \"to-fix\";\n    const segBtn = (active, left) => ({ display: \"inline-flex\", alignItems: \"center\", padding: \"5px 10px\", fontSize: 12, fontWeight: 600, border: \"none\", borderLeft: left ? \"1px solid var(--color-gray-200)\" : \"none\", cursor: \"pointer\", transition: \"all .15s\", background: active ? (fix ? \"var(--color-purple-100)\" : \"var(--color-gray-200)\") : \"var(--color-white)\", color: active ? (fix ? \"var(--color-purple-800)\" : \"var(--color-gray-700)\") : \"var(--color-gray-500)\" });\n\n    const replyNotes = isUser ? t.notes.slice(1) : t.notes;\n    const replies = replyNotes.map(n => ({\n      who: n.author === \"user\" ? \"Sie\" : \"Document Advisor\",\n      initial: n.author === \"user\" ? \"S\" : makeIcon(\"sparkles\", 11),\n      text: n.text,\n      dotStyle: { width: 22, height: 22, borderRadius: \"9999px\", display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\", flexShrink: 0, fontSize: 11, fontWeight: 700, background: n.author === \"user\" ? \"var(--color-gray-100)\" : \"var(--color-purple-100)\", color: n.author === \"user\" ? \"var(--color-gray-600)\" : \"var(--color-purple-700)\" },\n    }));\n\n    return {\n      id: t.id, isUser, isViolation: !isUser, isFocused: focused, rootStyle: root,\n      onFocus: () => { if (s.focusedId !== t.id) this.setState({ focusedId: t.id }); },\n      avatarStyle: { width: 28, height: 28, borderRadius: \"9999px\", display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\", flexShrink: 0, background: isUser ? \"var(--color-gray-100)\" : \"var(--color-purple-100)\", color: isUser ? \"var(--color-gray-600)\" : \"var(--color-purple-700)\" },\n      avatarIcon: isUser ? ico.user : ico.sparkle,\n      author: isUser ? \"Sie\" : \"Document Advisor\", time: \"gerade eben\",\n      sub: isUser ? \"Notiz\" : t.collection,\n      ruleName: t.rule_name, snippet: text.slice(t.range.start, t.range.end),\n      reason: t.reason, proposal: t.proposal, fileName: t.file_name, page: t.page_number,\n      commentText: isUser ? (t.notes[0] ? t.notes[0].text : \"\") : \"\",\n      hasReplies: replies.length > 0, replies,\n      showReply: s.phase === \"review\",\n      replyDraft: s.replyDrafts[t.id] || \"\",\n      onReplyChange: (e) => this.replyChange(t.id, e.target.value),\n      onReplyKey: (e) => { if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); this.replySubmit(t.id); } },\n      onReplySubmit: () => this.replySubmit(t.id),\n      onDelete: (e) => { e.stopPropagation(); this.deleteThread(t.id); },\n      onSetFix: (e) => { e.stopPropagation(); this.setStatus(t.id, \"to-fix\"); },\n      onSetSkip: (e) => { e.stopPropagation(); this.setStatus(t.id, \"skip\"); },\n      fixStyle: segBtn(fix, false), skipStyle: segBtn(!fix, true),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
